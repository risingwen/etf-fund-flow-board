name: Publish ETF board
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_daily:
        description: 补齐已披露的日度数据
        type: boolean
        default: true
  schedule:
    - cron: "43 0 * * 1-6"

concurrency:
  group: etf-pages
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_daily))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'openpyxl>=3.1,<4'
      - run: python pipeline/update_daily.py
      - name: Save minute snapshot when available
        continue-on-error: true
        run: node pipeline/update_snapshot.mjs
      - name: Save updated board data
        run: |
          if ! git diff --quiet -- site/data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- site/data.js
            git commit -m "data: refresh ETF board snapshots"
            git push origin HEAD:main
          fi

  publish:
    needs: update
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
