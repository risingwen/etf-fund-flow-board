name: Validate, update and publish ETF board
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_daily:
        description: 从公开源更新全部模块并逐项校验
        type: boolean
        default: true
  schedule:
    # 每天北京时间 08:50、16:10、20:50，含周末，补抓延迟披露。
    - cron: '50 0,12 * * *'
    - cron: '10 8 * * *'

concurrency:
  group: etf-pages
  cancel-in-progress: false
permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_daily))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      clean: ${{ steps.refresh.outputs.clean }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'openpyxl>=3.1,<4' 'eltdx==3.3.5'
      - name: Collect, validate, and retain last valid data on failure
        id: refresh
        run: python pipeline/refresh_all.py
      - name: Verify release and regression checks
        run: |
          python pipeline/data_quality.py
          python -m unittest discover -s pipeline/tests -v
      - name: Commit validated data and health report
        run: |
          git add -- site/data.js site/broad.js site/minute-history.json site/themes.json site/etf-margin.json site/leverage.json site/rotation.json site/funds.json site/fund-facts.json site/market-status.json site/data-quality.json site/audit/market-coverage.json reference/data/broad_members.csv reference/data/etf_catalogue.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh validated ETF data and health report'
            git push origin HEAD:main
          fi

  publish:
    needs: update
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Require complete validation before every deployment
        run: python3 pipeline/data_quality.py
      - uses: actions/configure-pages@v5
      - run: python3 pipeline/build_history_manifest.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [update, publish]
    if: ${{ !cancelled() && needs.update.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail visibly when a source failed or expected data is overdue
        env:
          CLEAN: ${{ needs.update.outputs.clean }}
        run: |
          if [ "$CLEAN" != 'true' ]; then
            echo '::error::Some data is stale or failed validation. Safe data and the health report were published. See data-quality.json; the next schedule retries.'
            exit 1
          fi
