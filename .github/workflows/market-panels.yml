name: Update theme and margin panels
on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 08:50、16:10、20:50，含周末，捕获延迟披露。
    - cron: '50 0,12 * * *'
    - cron: '10 8 * * *'

concurrency:
  group: etf-pages
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'openpyxl>=3.1,<4' 'eltdx==3.3.5'
      - name: Refresh public theme and margin data
        id: refresh
        continue-on-error: true
        run: python pipeline/update_market_panels.py
      - name: Validate publishable files
        run: python pipeline/validate_market_panels.py
      - name: Save complete data and update status
        run: |
          if ! git diff --quiet -- site/etf-margin.json site/leverage.json site/themes.json site/market-status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- site/etf-margin.json site/leverage.json site/themes.json site/market-status.json
            git commit -m 'data: refresh public theme and margin panels'
            git push origin HEAD:main
          fi
      - name: Report source failures
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Some sources failed. Last valid data and an explicit failure status are published; the next scheduled run retries.'
  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - run: python3 pipeline/build_history_manifest.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
